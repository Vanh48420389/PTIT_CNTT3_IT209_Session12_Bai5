name: Fixed CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test & Docker Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # =======================================================================
      # [KHẮC PHỤC LỖI 1] Cấp quyền thực thi cho Gradle Wrapper
      # - Lỗi ban đầu: ./gradlew không có cờ thực thi (+x), runner báo lỗi:
      #   /home/runner/work/_temp/xxx.sh: line 1: ./gradlew: Permission denied
      # - Khắc phục: Thêm lệnh chmod +x gradlew trước khi thực thi lệnh test.
      # =======================================================================
      - name: Cấp quyền thực thi cho Gradle Wrapper (Fix Lỗi 1)
        run: chmod +x gradlew

      - name: Thực thi JUnit Test
        run: ./gradlew test

      - name: Đóng gói tệp JAR ứng dụng
        run: ./gradlew bootJar

      # =======================================================================
      # [KHẮC PHỤC LỖI 2] Sửa lỗi chính tả biến Secret đăng nhập Docker Registry
      # - Lỗi ban đầu: Sai chính tả biến Secret (ví dụ: ${{ secrets.REGISTRY_TOKNE }})
      #   khiến password bị rỗng, dẫn đến lỗi:
      #   Error response from daemon: Get "...": unauthorized: incorrect username or password
      # - Khắc phục: Sửa chính tả thành ${{ secrets.REGISTRY_TOKEN }} chuẩn xác.
      #   Đồng thời hỗ trợ linh hoạt fallback ${{ secrets.GITHUB_TOKEN }} cho GHCR.
      # =======================================================================
      - name: Đăng nhập Docker Registry (Fix Lỗi 2)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Chuẩn hóa tên repository về chữ thường theo quy ước Docker
      - name: Chuyển tên Repository về chữ thường
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # =======================================================================
      # [KHẮC PHỤC LỖI 3] Cấu hình Build Context và đường dẫn file Dockerfile
      # - Lỗi ban đầu: Chỉ định sai ngữ cảnh thư mục (ví dụ context: ./src hoặc
      #   file: ./docker/Dockerfile), khiến Buildx báo lỗi:
      #   ERROR: failed to solve: failed to read dockerfile: open Dockerfile: no such file or directory
      # - Khắc phục: Cấu hình context: . và file: ./Dockerfile đúng vị trí gốc.
      # =======================================================================
      - name: Đóng gói và đẩy Docker Image lên Registry (Fix Lỗi 3)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:latest
